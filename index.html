16.8 12 16.5M20 16.8 12 16.5M12 21.5v-5"/></svg></button></div>

(()=>{const $=id=>document.getElementById(id),cv=$('view'),ctx=cv.getContext('2d'),sc=$('sectionView'),sctx=sc.getContext('2d');let pts=[],drag=null,auto=false,mode='free',shape='cube',sides=6,g,EPS=1e-7,pending=false,zoom=1,lastPhi=0;const ZMIN=.5,ZMAX=3,CAMDIST=4.2,ROT=.0048;const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0),sub=(a,b)=>a.map((x,i)=>x-b[i]);
/* ===== 화면 기준 회전 =====
   Q = 3×3 회전행렬. 행 0,1,2 = 화면의 오른쪽(X) / 위쪽(Y) / 화면 안쪽(D) 방향을 도형 좌표로 나타낸 것.
   드래그를 '현재 화면 기준'으로 적용하므로, 도형이 어떤 자세여도(위/아래 정면을 볼 때도)
   위로 끌면 보이는 면이 위로, 오른쪽으로 끌면 오른쪽으로 일관되게 돈다. */
function initQ(){return[[1,0,0],[0,1,0],[0,0,1]]}
let Q=initQ();
function orthonormalize(){let r0=Q[0],r1=Q[1];let l=Math.hypot(...r0);r0=r0.map(x=>x/l);let d=dot(r1,r0);r1=r1.map((x,i)=>x-d*r0[i]);l=Math.hypot(...r1);r1=r1.map(x=>x/l);Q=[r0,r1,cross(r0,r1)]}
/* 화면의 세로축을 중심으로 회전: 오른쪽으로 끌면(a>0) 앞면이 오른쪽으로 */
function rotY(a){const c=Math.cos(a),s=Math.sin(a),X=Q[0],D=Q[2];Q=[X.map((x,i)=>c*x-s*D[i]),Q[1],X.map((x,i)=>s*x+c*D[i])];orthonormalize()}
/* 화면의 가로축을 중심으로 회전: 위로 끌면(f>0) 앞면이 위로 */
function rotX(f){const c=Math.cos(f),s=Math.sin(f),Y=Q[1],D=Q[2];Q=[Q[0],Y.map((y,i)=>c*y-s*D[i]),Y.map((y,i)=>s*y+c*D[i])];orthonormalize()}
function hull(v){let map=new Map(),center=[0,0,0];v.forEach(p=>p.forEach((x,i)=>center[i]+=x/v.length));for(let i=0;i<v.length;i++)for(let j=i+1;j<v.length;j++)for(let k=j+1;k<v.length;k++){let n=cross(sub(v[j],v[i]),sub(v[k],v[i])),l=Math.hypot(...n);if(l<EPS)continue;n=n.map(x=>x/l);let ds=v.map(p=>dot(n,sub(p,v[i])));if(ds.some(x=>x>1e-6)&&ds.some(x=>x< -1e-6))continue;let ids=ds.map((x,t)=>Math.abs(x)<1e-6?t:-1).filter(x=>x>=0);if(ids.length<3)continue;let key=ids.join(',');if(map.has(key))continue;let fc=[0,0,0];ids.forEach(id=>v[id].forEach((x,a)=>fc[a]+=x/ids.length));if(dot(n,sub(fc,center))<0)n=n.map(x=>-x);let u=sub(v[ids[0]],fc),ul=Math.hypot(...u);u=u.map(x=>x/ul);let vv=cross(n,u);ids.sort((a,b)=>Math.atan2(dot(sub(v[a],fc),vv),dot(sub(v[a],fc),u))-Math.atan2(dot(sub(v[b],fc),vv),dot(sub(v[b],fc),u)));map.set(key,ids)}return [...map.values()]}

function pick(x,y){if(g.sphere){if(mode==='discrete'){let best=null,bd=22;sphereMarks().forEach(p=>{let q=proj(p,cv.clientWidth,cv.clientHeight),dist=Math.hypot(x-q.x,y-q.y);if(dist<bd){bd=dist;best=p}});return best}return pickSphere(x,y)}if(mode==='discrete'){let candidates=[];g.v.forEach(p=>{if(!candidates.some(q=>Math.hypot(...sub(p,q))<1e-5))candidates.push(p)});edges().forEach(e=>{let m=g.v[e.a].map((v,i)=>(v+g.v[e.b][i])/2);if(!candidates.some(q=>Math.hypot(...sub(m,q))<1e-5))candidates.push(m)});let best=null,bd=22;candidates.forEach(p=>{let q=proj(p,cv.clientWidth,cv.clientHeight),dist=Math.hypot(x-q.x,y-q.y);if(dist<bd){bd=dist;best=p}});return best}let best=null,bd=18;edges().forEach(e=>{let A=proj(g.v[e.a],cv.clientWidth,cv.clientHeight),B=proj(g.v[e.b],cv.clientWidth,cv.clientHeight),dx=B.x-A.x,dy=B.y-A.y,t=Math.max(0,Math.min(1,((x-A.x)*dx+(y-A.y)*dy)/(dx*dx+dy*dy||1))),px=A.x+t*dx,py=A.y+t*dy,dist=Math.hypot(x-px,y-py);if(dist<bd){bd=dist;best=g.v[e.a].map((v,k)=>v+t*(g.v[e.b][k]-v))}});return best}
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,m:false,axis:null};cv.setPointerCapture(e.pointerId)});
/* 드래그: 가로·세로 축 잠금 + 화면 기준 회전 (위/아래 정면에서도 좌우 회전 가능, 방향 반전 없음) */
cv.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.m){let tx=e.clientX-drag.sx,ty=e.clientY-drag.sy;if(Math.abs(tx)+Math.abs(ty)>4){drag.m=true;drag.axis=Math.abs(tx)>=Math.abs(ty)?'x':'y'}}if(drag.m){if(drag.axis==='x')rotY(dx*ROT);else rotX(-dy*ROT);drag.x=e.clientX;drag.y=e.clientY;requestDraw()}});
cv.addEventListener('pointerup',e=>{if(!drag)return;let moved=drag.m;drag=null;if(!moved&&pts.length<3){let r=cv.getBoundingClientRect(),p=pick(e.clientX-r.left,e.clientY-r.top);if(p&&!pts.some(q=>Math.hypot(...sub(p,q))<.025)){pts.push(p);draw()}}});cv.addEventListener('pointercancel',()=>drag=null);
/* 확대/축소 슬라이더: 위로 끌면 확대, 아래로 끌면 축소 (로그 눈금, 0.5배~3배) */
const zt=$('zoomTrack'),zth=$('zoomThumb'),zv=$('zoomVal');let zdrag=false,zanim=0;
function zoomUI(){const t=Math.log(zoom/ZMIN)/Math.log(ZMAX/ZMIN);zth.style.top=(4+(1-t)*(zt.clientHeight-8))+'px';zv.textContent=zoom.toFixed(1)+'×'}
function zoomFrom(y){const r=zt.getBoundingClientRect(),t=Math.max(0,Math.min(1,1-(y-r.top-4)/(r.height-8)));zoom=ZMIN*Math.pow(ZMAX/ZMIN,t);zoomUI();requestDraw()}
function zoomReset(){cancelAnimationFrame(zanim);const z0=zoom,t0=performance.now(),dur=260;if(Math.abs(Math.log(z0))<1e-4){zoom=1;zoomUI();requestDraw();return}const step=now=>{const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);zoom=Math.exp(Math.log(z0)*(1-e));if(k>=1)zoom=1;zoomUI();draw();if(k<1)zanim=requestAnimationFrame(step)};zanim=requestAnimationFrame(step)}
zt.addEventListener('pointerdown',e=>{cancelAnimationFrame(zanim);zdrag=true;zt.setPointerCapture(e.pointerId);zoomFrom(e.clientY);e.stopPropagation()});
zt.addEventListener('pointermove',e=>{if(zdrag)zoomFrom(e.clientY)});
zt.addEventListener('pointerup',()=>{zdrag=false});zt.addEventListener('pointercancel',()=>{zdrag=false});
zv.addEventListener('pointerdown',e=>e.stopPropagation());
zv.addEventListener('click',e=>{e.stopPropagation();zoomReset()});
